<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="NV5 Reise – reiseplanlegger for kollektivtrafikk."
    />
    <meta name="theme-color" content="#0b1220" />
    <title>NV5 Reise – reiseplanlegger</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/reise.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/sis/icons/favicon-32.png" />
  </head>
  <body>
    <div class="reise">
      <header class="reise__header">
        <div class="reise__brand">
          <h1>NV5 Reise</h1>
          <p class="reise__tagline">Planlegg reise med kollektivtrafikk</p>
        </div>
        <a class="reise__nav" href="/sis/">Sanntidstavle</a>
      </header>

      <main class="reise__main">
        <form class="reise__search" id="tripForm">
          <div class="reise__field">
            <label class="reise__label" for="fromSearch">Fra</label>
            <input
              type="search"
              id="fromSearch"
              placeholder="F.eks. Tveita T"
              autocomplete="off"
              enterkeyhint="search"
            />
            <ul class="reise__results" id="fromResults" hidden></ul>
          </div>

          <div class="reise__field">
            <div class="reise__label-row">
              <label class="reise__label" for="toSearch">Til</label>
              <button type="button" class="reise__swap" id="swapStops" title="Bytt fra og til">
                ⇅ Bytt
              </button>
            </div>
            <input
              type="search"
              id="toSearch"
              placeholder="F.eks. Majorstuen"
              autocomplete="off"
              enterkeyhint="search"
            />
            <ul class="reise__results" id="toResults" hidden></ul>
          </div>

          <div class="reise__field">
            <span class="reise__label">Avreise</span>
            <div class="reise__when" role="group" aria-label="Avreisetidspunkt">
              <button type="button" class="reise__when-btn is-active" data-when="now">Nå</button>
              <button type="button" class="reise__when-btn" data-when="depart">Velg tid</button>
            </div>
            <div class="reise__datetime" id="tripDateTimeWrap" hidden>
              <input type="date" id="tripDate" aria-label="Dato" />
              <input type="time" id="tripTime" aria-label="Tidspunkt" />
            </div>
          </div>

          <button type="submit" class="reise__submit" id="tripSubmit">Søk reise</button>
        </form>

        <p class="reise__status" id="tripStatus" hidden aria-live="polite"></p>

        <div class="reise__patterns" id="tripResults" aria-live="polite"></div>
      </main>

      <footer class="reise__footer">
        <a class="reise__link" href="/sis/">← NV5 SIS sanntidstavle</a>
        <button type="button" class="reise__sync" id="syncReise" title="Hent Reise fra GitHub">
          Hent ny versjon
        </button>
        <a class="reise__link" href="/admin/">NV5 Admin</a>
      </footer>
    </div>

    <script src="/shared/js/util.js"></script>
    <script src="config.js" defer></script>
    <script src="/shared/js/entur.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/plan.js" defer></script>
  </body>
</html>
