# Speiles til /nginx-nv5.conf ved ?sync=server (site root).
# Én gang i HTTPS server-block:
#   include /ABS/STI/TIL/nginx-nv5.conf;
# Deretter: nginx -t && systemctl reload nginx

# --- SIS ---
location = /sis/content { return 302 /sis/; }
location = /sis/content/ { return 302 /sis/; }
location = /sis/content/index.html { return 302 /sis/; }
location = /sis/nginx-sis-pwa.conf { deny all; return 404; }

# --- Reise ---
location = /reise/content { return 302 /reise/; }
location = /reise/content/ { return 302 /reise/; }
location = /reise/content/index.html { return 302 /reise/; }

# --- Site root (ingen mappevisning) ---
location = / { autoindex off; }

# --- Intern PHP-bibliotek ---
location ^~ /nv5-lib/ { deny all; return 404; }

# --- Config ---
location = /nginx-nv5.conf { deny all; return 404; }

# --- Admin (passord via NV5_ADMIN_PASSWORD i PHP-env) ---
# Apache bak proxy: CGIPassAuth On
# nginx + PHP-FPM: fastcgi_param HTTP_AUTHORIZATION $http_authorization;

# --- Shared (statisk, ingen PHP) ---
location ^~ /shared/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    location ~ \.php$ { deny all; return 404; }
}
